<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HID - Pharmacy POS & Dispensary</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ehr-theme.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="ehr-green">
  <div id="root"></div>

  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="hospital-data.jsx"></script>
  <script type="text/babel" src="ehr-data.jsx"></script>
  <script type="text/babel" src="ehr-ops.jsx"></script>

  <script type="text/babel">
    const PharmacyApp = () => {
      return (
        <ToastProvider>
          <div className="ehr-shell">
            <header className="ehr-topbar">
              <div className="ehr-topbar-brand">
                <div style={{ width: 32, height: 32, borderRadius: 'var(--radius-md)', background: 'var(--accent)', color: '#fff', fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>HID</div>
                <div>
                  <div className="ehr-topbar-brand-name">HID Pharmacy POS & Dispensary</div>
                  <div style={{ fontSize: '10px', color: 'var(--text-secondary)' }}>Point of Sale • Prescription Fulfillment</div>
                </div>
              </div>
            </header>
            <main className="ehr-content">
              <PharmacyModule />
            </main>
          </div>
        </ToastProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PharmacyApp />);
  </script>
</body>
</html>
