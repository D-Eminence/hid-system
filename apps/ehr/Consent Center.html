<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HID - Consent Center</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ehr-theme.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="ehr-green">
  <div id="root"></div>

  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="hospital-data.jsx"></script>
  <script type="text/babel" src="ehr-data.jsx"></script>

  <script type="text/babel">
    const ConsentCenterApp = () => {
      const [grants, setGrants] = React.useState([]);
      const [requests, setRequests] = React.useState([]);

      const handleApprove = (id) => {
        setRequests(prev => prev.filter(r => r.id !== id));
        showToast('Access Grant Approved', 'check');
      };

      const handleDeny = (id) => {
        setRequests(prev => prev.filter(r => r.id !== id));
        showToast('Access Request Denied', 'x');
      };

      const handleRevoke = (id) => {
        setGrants(prev => prev.filter(g => g.id !== id));
        showToast('Access Grant Revoked', 'shield');
      };

      return (
        <ToastProvider>
          <div className="ehr-shell">
            <header className="ehr-topbar">
              <div className="ehr-topbar-brand">
                <div style={{ width: 32, height: 32, borderRadius: 'var(--radius-md)', background: 'var(--accent)', color: '#fff', fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>HID</div>
                <div>
                  <div className="ehr-topbar-brand-name">HID Patient Consent & Access Control Center</div>
                  <div style={{ fontSize: '10px', color: 'var(--text-secondary)' }}>Patient Self-Service Privacy Portal</div>
                </div>
              </div>
            </header>

            <main className="ehr-content fade-in">
              <PageHead
                title="My Health Data Consent Center"
                sub="Manage who can access your medical records across hospitals, clinics, labs & pharmacies"
              />

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 'var(--space-600)' }}>
                {/* Pending Requests */}
                <Card pad>
                  <SectionHeader title="Pending Access Requests" sub="Institutions requesting to view your record" />
                  {requests.length === 0 ? (
                    <EmptyState title="No Pending Requests" sub="You have no active access requests waiting for approval." icon="check" />
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-400)', marginTop: 'var(--space-400)' }}>
                      {requests.map(req => (
                        <div key={req.id} style={{ border: '1px solid var(--border-default)', borderRadius: 'var(--radius-xl)', padding: 'var(--space-400)', background: 'var(--surface-muted)' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                            <span style={{ fontWeight: 700, fontSize: 'var(--fs-md)', color: 'var(--text-heading)' }}>{req.staff}</span>
                            <Badge variant="blue">{req.time}</Badge>
                          </div>
                          <div style={{ fontSize: 'var(--fs-sm)', color: 'var(--text-body)', marginBottom: 4 }}>{req.facility}</div>
                          <div style={{ fontSize: 'var(--fs-caption)', color: 'var(--text-secondary)', marginBottom: 12 }}>Reason: "{req.reason}"</div>
                          <div style={{ display: 'flex', gap: 'var(--space-300)' }}>
                            <Button variant="primary" size="sm" icon="check" onClick={() => handleApprove(req.id)}>Approve Access (1 Hr)</Button>
                            <Button variant="secondary" size="sm" icon="x" onClick={() => handleDeny(req.id)}>Deny Request</Button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </Card>

                {/* Active Grants */}
                <Card pad>
                  <SectionHeader title="Active Record Grants" sub="Clinicians currently authorized to view your chart" />
                  {grants.length === 0 ? (
                    <EmptyState title="No Active Grants" sub="No clinician currently holds an active grant to your record." icon="shield" />
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-400)', marginTop: 'var(--space-400)' }}>
                      {grants.map(g => (
                        <div key={g.id} style={{ border: '1px solid var(--border-default)', borderRadius: 'var(--radius-xl)', padding: 'var(--space-400)', background: 'var(--surface)' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                            <span style={{ fontWeight: 700, fontSize: 'var(--fs-md)', color: 'var(--text-heading)' }}>{g.staff}</span>
                            <Badge variant="success">ACTIVE GRANT</Badge>
                          </div>
                          <div style={{ fontSize: 'var(--fs-sm)', color: 'var(--text-body)', marginBottom: 4 }}>{g.facility}</div>
                          <div style={{ fontSize: 'var(--fs-caption)', color: 'var(--text-secondary)', marginBottom: 12 }}>Expires at {new Date(g.expires).toLocaleTimeString()}</div>
                          <Button variant="secondary" size="sm" icon="x" onClick={() => handleRevoke(g.id)} style={{ color: 'var(--danger-500)' }}>Revoke Access Now</Button>
                        </div>
                      ))}
                    </div>
                  )}
                </Card>
              </div>
            </main>
          </div>
        </ToastProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ConsentCenterApp />);
  </script>
</body>
</html>
