# Included in every proxied API location.
# With HID_REQUIRE_CLIENT_IP on, a request whose client address did not come
# from the edge (X-HID-Client-IP from the VPC, see nginx.conf.template) never
# reaches a backend: per-network limits and audit would otherwise key on the
# load balancer, one address shared by every client.
if ($hid_client_address_missing) {
  add_header Cache-Control "no-store" always;
  return 403 '{"type":"about:blank","title":"Request rejected","status":403,"detail":"The request did not arrive through the HID edge.","code":"CLIENT_ADDRESS_REQUIRED"}';
}
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# Discard any caller-supplied forwarding chain. $remote_addr is the client
# address realip took from X-HID-Client-IP, or the connecting peer when that
# header was not trusted. The backends trust only the deployment's
# TRUST_PROXY_CIDRS (the VPC), so this is the address they see as request.ip.
proxy_set_header X-Forwarded-For $remote_addr;
# The raw header is not passed on; X-Forwarded-For carries the result.
proxy_set_header X-HID-Client-IP "";
proxy_set_header Origin $http_origin;
proxy_set_header X-Correlation-ID $http_x_correlation_id;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_intercept_errors on;
