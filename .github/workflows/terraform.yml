name: Terraform checks and plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        type: choice
        required: true
        options: [development, staging, production]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install the checksum-verified Terraform CLI
        env:
          TERRAFORM_VERSION: "1.13.4"
          TERRAFORM_SHA256: 98aa516201e948306698efd9954ab4cc0d1227c2578ba56245898b5f679e590b
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/terraform-cli"
          echo "$RUNNER_TEMP/terraform-cli" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s scripts -p 'test_deployment*.py'
        working-directory: infra/terraform
      - run: python -m unittest discover -s scripts -p 'test_production*.py'
        working-directory: infra/terraform
      - run: python -m unittest discover -s tests -p 'test_production*.py'
        working-directory: infra/terraform
      - run: node --test tests/workload-issuer.test.mjs
        working-directory: infra/terraform
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
      - run: terraform test
        working-directory: infra/terraform

  plan:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    # Never empty: on pull_request this job is skipped and inputs are empty.
    environment: ${{ inputs.environment || 'development' }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install the checksum-verified Terraform CLI
        env:
          TERRAFORM_VERSION: "1.13.4"
          TERRAFORM_SHA256: 98aa516201e948306698efd9954ab4cc0d1227c2578ba56245898b5f679e590b
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/terraform-cli"
          echo "$RUNNER_TEMP/terraform-cli" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize remote state
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=health-identity/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Write environment variables
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: printf '%s' "$TFVARS" > "environments/${{ inputs.environment }}.tfvars"
      - name: Plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_MANAGED: ${{ vars.STAGING_RELEASE_MANAGED }}
          PRODUCTION_RELEASE_MANAGED: ${{ vars.PRODUCTION_RELEASE_MANAGED }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          RELEASE_KMS_KEY_ARN: ${{ vars.RELEASE_KMS_KEY_ARN }}
          RELEASE_LEASE_TABLE: hid-staging-deployment-leases
        run: |
          if [ "$ENVIRONMENT" = production ] && [ "$PRODUCTION_RELEASE_MANAGED" = true ]; then
            python scripts/production_release_infrastructure.py plan --var-file "environments/production.tfvars" --manifest release-review.json
          elif [ "$ENVIRONMENT" = staging ] && [ "$RELEASE_MANAGED" = true ]; then
            python scripts/release_infrastructure.py plan --var-file "environments/staging.tfvars" --manifest release-review.json
          else
            terraform plan -input=false -var-file="environments/$ENVIRONMENT.tfvars" -out=deployment.tfplan
          fi
