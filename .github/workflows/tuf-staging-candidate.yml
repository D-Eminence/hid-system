name: Admit separately signed staging TUF candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tuf-staging-candidate
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging-candidate
    env:
      APPROVED_SOURCE_SHA: ${{ vars.TUF_STAGING_CANDIDATE_SOURCE_SHA }}
      APPROVED_REF: ${{ vars.TUF_PROTECTED_REF }}
      APPROVAL_JSON: ${{ vars.TUF_STAGING_CANDIDATE_APPROVAL_JSON }}
      APPROVAL_SHA256: ${{ vars.TUF_STAGING_CANDIDATE_APPROVAL_SHA256 }}
    steps:
      - name: Bind owner-approved source and plan before loading repository code
        id: pins
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFile, appendFile } from 'node:fs/promises';
          const e = process.env;
          const reject = () => { throw Error('staging candidate approval pins rejected'); };
          if (e.GITHUB_REPOSITORY !== 'D-Eminence/hid-system' || e.GITHUB_REPOSITORY_ID !== '1317340803'
            || e.GITHUB_REPOSITORY_OWNER_ID !== '182018869' || e.GITHUB_EVENT_NAME !== 'workflow_dispatch'
            || !/^[a-f0-9]{40}$/.test(e.APPROVED_SOURCE_SHA) || e.GITHUB_SHA !== e.APPROVED_SOURCE_SHA
            || e.GITHUB_WORKFLOW_SHA !== e.APPROVED_SOURCE_SHA || e.GITHUB_REF_PROTECTED !== 'true'
            || e.APPROVED_REF !== 'refs/heads/tuf-production-release' || e.GITHUB_REF !== e.APPROVED_REF
            || e.GITHUB_WORKFLOW_REF !== 'D-Eminence/hid-system/.github/workflows/tuf-staging-candidate.yml@refs/heads/tuf-production-release'
            || !/^[a-f0-9]{64}$/.test(e.APPROVAL_SHA256) || !e.APPROVAL_JSON
            || createHash('sha256').update(e.APPROVAL_JSON).digest('hex') !== e.APPROVAL_SHA256) reject();
          const plan = JSON.parse(e.APPROVAL_JSON);
          if (plan.environment !== 'staging' || plan.git_sha !== e.APPROVED_SOURCE_SHA
            || !/^[1-9][0-9]{0,19}$/.test(plan.source_run_id) || !/^[1-9][0-9]{0,19}$/.test(plan.source_artifact_id)) reject();
          await writeFile(`${e.RUNNER_TEMP}/candidate-approval.json`, e.APPROVAL_JSON, { flag: 'wx', mode: 0o600 });
          await appendFile(e.GITHUB_OUTPUT, `source_run_id=${plan.source_run_id}\nsource_artifact_id=${plan.source_artifact_id}\n`);
          NODE
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ vars.TUF_STAGING_CANDIDATE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install locked data validators without lifecycle scripts
        run: |
          npm --prefix release ci --ignore-scripts
          npm --prefix infra/cloudflare ci --ignore-scripts
      - name: Verify owner review policy and exact producer artifact provenance
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: node release/scripts/admit-staging-candidate.mjs provenance "${RUNNER_TEMP}/candidate-approval.json" "${APPROVAL_SHA256}" "${RUNNER_TEMP}/candidate-source-provenance.json"
      - name: Download immutable signed data from the approved producer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pins.outputs.source_artifact_id }}
          run-id: ${{ steps.pins.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-input
      - name: Verify staging signatures root source repository and artifact set pins
        run: node release/scripts/admit-staging-candidate.mjs admit "${RUNNER_TEMP}/candidate-approval.json" "${APPROVAL_SHA256}" "${RUNNER_TEMP}/candidate-input/repository" "${RUNNER_TEMP}/admitted-candidate"
      - name: Retain source provenance with the admitted data
        run: cp "${RUNNER_TEMP}/candidate-source-provenance.json" "${RUNNER_TEMP}/admitted-candidate/source-provenance.json"
      - name: Upload immutable publisher input without publication authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-staging-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admitted-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
