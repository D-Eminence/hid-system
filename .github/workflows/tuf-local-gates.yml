name: TUF local security gates
on:
  pull_request: null
  # Feature branches are checked once, by their pull request run; start a
  # manual run for a branch without a pull request.
  push:
    branches:
      - staging-novu-ci-20261005
      - main
      - tuf-production-release
  workflow_dispatch: null
  # Weekly, so govulncheck in the TUF client job sees new Go advisories even
  # when no change touches the TUF tooling. A scheduled run runs every gate.
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
concurrency:
  # Pull request runs share one group per pull request, and a newer commit
  # cancels the older run. Push and dispatch runs get one group per commit, so
  # a newer commit never cancels or replaces another commit's run, and every
  # protected-branch commit keeps its own full record. (GitHub keeps one queued
  # run per group and replaces it when a newer run joins, so a per-branch group
  # could drop a commit's run without a trace.) The event name keeps a
  # scheduled or manual run of a commit from replacing its queued push run.
  group: tuf-local-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: "true"
  NODE_VERSION: 22.23.2
  GO_VERSION: 1.26.11
  BROKER_GO_BUILD_IMAGE: docker.io/library/golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
  BROKER_LAMBDA_RUNTIME_IMAGE: public.ecr.aws/lambda/provided:al2023@sha256:7dea43facdd67ffd71aa540527b6af413dfdae0133a0423ee9c329bf1e5adb6c
jobs:
  changes:
    name: Choose local gates from the changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip_go_jobs: ${{ steps.select.outputs.skip_go_jobs }}
      workspace_gates: ${{ steps.select.outputs.workspace_gates }}
      workspace_install: ${{ steps.select.outputs.workspace_install }}
      skip_workspace_test: ${{ steps.select.outputs.skip_workspace_test }}
      test_gates: ${{ steps.select.outputs.test_gates }}
      test_install: ${{ steps.select.outputs.test_install }}
      skip_migration_rehearsal: ${{ steps.select.outputs.skip_migration_rehearsal }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      # A pull request run checks out the merge commit; its first parent is the
      # base branch tip, so depth 2 is enough to diff the pull request.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Only pull request runs are narrowed; any other event, and any doubt
      # about the changed paths, selects every gate. The rules are in the script.
      - name: Choose gates from the pull request's changed paths
        id: select
        run: node release/scripts/select-local-gates.mjs
      - name: Retain the gate selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-local-changes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-gate-selection
          if-no-files-found: error
          retention-days: 90
  release-contracts:
    name: Release contracts and admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up the minimum supported Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Audit release verifier dependencies
        shell: /usr/bin/bash -p -e {0}
        run: |
          export PATH="$RUNNER_TOOL_CACHE/node/22.23.2/x64/bin:/usr/bin:/bin"
          test "$(node --version)" = v22.23.2
          npm --prefix release audit --audit-level=moderate
        id: gate_2
      - name: Install release and shared validator dependencies from their lockfiles
        run: |
          npm --prefix release ci --ignore-scripts
          npm --prefix infra/cloudflare ci --ignore-scripts
        id: gate_1
      - name: Test release admission and adversarial contracts
        run: npm --prefix release test
        id: gate_3
      - name: Verify release schemas and machine configuration
        run: npm --prefix release run verify
        id: gate_4
      - name: Record credential-free job evidence
        env:
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node release/scripts/collect-local-gate-evidence.mjs
      - name: Retain independent job evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-local-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-gate-evidence.json
          if-no-files-found: error
          retention-days: 90
  tuf-client:
    name: Pinned TUF client and reproducibility
    needs: changes
    # Runs on every push, manual and scheduled run; a pull request skips it only
    # when the changes job says no changed path reaches the TUF tooling. A
    # failed changes job leaves the output empty, so the job runs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.skip_go_jobs != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node.js for the toolchain evidence verifier
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: tools/tuf-release/go.sum
      - name: Verify the patched release-build toolchain
        run: node tools/tuf-release/scripts/verify-production-toolchain.mjs
        id: gate_1
      - name: Reject reachable Go vulnerabilities
        run: node release/scripts/go-vulnerability-gate.mjs "${RUNNER_TEMP}/go-vulnerability-evidence.json"
        id: gate_2
      - name: Run race-enabled TUF client tests
        working-directory: tools/tuf-release
        run: go test -count=1 -race ./...
        id: gate_3
      - name: Vet the TUF client
        working-directory: tools/tuf-release
        run: go vet ./...
        id: gate_4
      - name: Verify pinned Go modules
        working-directory: tools/tuf-release
        run: go mod verify
        id: gate_9
      - name: Prove the HID client build is reproducible
        working-directory: tools/tuf-release
        run: |
          build_root="${RUNNER_TEMP}/hid-tuf-client-reproducibility"
          mkdir -p "${build_root}"
          for build_label in a b; do
            env \
              GOENV=off \
              GOTOOLCHAIN=local \
              GOOS=linux \
              GOARCH=amd64 \
              GOAMD64=v1 \
              CGO_ENABLED=0 \
              SOURCE_DATE_EPOCH=0 \
              TZ=UTC \
              LC_ALL=C \
              LANG=C \
              go build \
                -mod=readonly \
                -trimpath \
                -buildvcs=false \
                -ldflags=-buildid= \
                -o "${build_root}/hid-tuf-${build_label}" \
                ./cmd/hid-tuf
          done
          cmp "${build_root}/hid-tuf-a" "${build_root}/hid-tuf-b"
        id: gate_5
      - name: Prove the AWS signing-broker binary build is reproducible
        working-directory: tools/tuf-release
        run: |
          build_root="${RUNNER_TEMP}/hid-tuf-signing-broker-reproducibility"
          mkdir -p "${build_root}"
          for build_label in a b; do
            env \
              GOENV=off \
              GOTOOLCHAIN=local \
              GOOS=linux \
              GOARCH=amd64 \
              GOAMD64=v1 \
              CGO_ENABLED=0 \
              SOURCE_DATE_EPOCH=0 \
              TZ=UTC \
              LC_ALL=C \
              LANG=C \
              go build \
                -mod=readonly \
                -trimpath \
                -buildvcs=false \
                -ldflags=-buildid= \
                -o "${build_root}/bootstrap-${build_label}" \
                ./cmd/hid-tuf-signing-broker
          done
          cmp "${build_root}/bootstrap-a" "${build_root}/bootstrap-b"
        id: gate_6
      - name: Prove the metadata and publication operators are reproducible
        working-directory: tools/tuf-release
        run: |
          build_root="${RUNNER_TEMP}/hid-tuf-operator-reproducibility"
          mkdir -p "${build_root}"
          for command in hid-tuf-repo hid-tuf-publication hid-tuf-journal; do
            for build_label in a b; do
              env \
                GOENV=off \
                GOTOOLCHAIN=local \
                GOOS=linux \
                GOARCH=amd64 \
                GOAMD64=v1 \
                CGO_ENABLED=0 \
                SOURCE_DATE_EPOCH=0 \
                TZ=UTC \
                LC_ALL=C \
                LANG=C \
                go build \
                  -mod=readonly \
                  -trimpath \
                  -buildvcs=false \
                  -ldflags=-buildid= \
                  -o "${build_root}/${command}-${build_label}" \
                  "./cmd/${command}"
            done
            cmp "${build_root}/${command}-a" "${build_root}/${command}-b"
          done
        id: gate_7
      - name: Validate the digest-pinned signing-broker Dockerfile
        run: docker buildx build --check --platform linux/amd64 --file tools/tuf-release/Dockerfile.signing-broker --build-arg GO_BUILD_IMAGE="${BROKER_GO_BUILD_IMAGE}" --build-arg LAMBDA_RUNTIME_IMAGE="${BROKER_LAMBDA_RUNTIME_IMAGE}" tools/tuf-release
        id: gate_8
      - name: Record credential-free job evidence
        env:
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node release/scripts/collect-local-gate-evidence.mjs
      - name: Retain independent job evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-local-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ${{ runner.temp }}/local-gate-evidence.json
            ${{ runner.temp }}/go-vulnerability-evidence.json
          if-no-files-found: error
          retention-days: 90
  aws-release-trust:
    name: AWS release-trust source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up the minimum supported Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Audit AWS infrastructure dependencies against reviewed exceptions
        shell: /usr/bin/bash -p -e {0}
        run: |
          export PATH="$RUNNER_TOOL_CACHE/node/22.23.2/x64/bin:/usr/bin:/bin"
          test "$(node --version)" = v22.23.2
          node release/scripts/npm-audit-with-exceptions.mjs infra/aws
        id: gate_2
      - name: Install AWS infrastructure and shared validator dependencies from lockfiles
        run: |
          npm --prefix infra/aws ci
          npm --prefix release ci --ignore-scripts
        id: gate_1
      - name: Type-check release-trust infrastructure
        run: npm --prefix infra/aws run typecheck
        id: gate_3
      - name: Test release-trust policy and synthesized resources
        run: npm --prefix infra/aws test
        id: gate_4
      - name: Record credential-free job evidence
        env:
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node release/scripts/collect-local-gate-evidence.mjs
      - name: Retain independent job evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-local-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-gate-evidence.json
          if-no-files-found: error
          retention-days: 90
  cloudflare-tuf:
    name: Cloudflare TUF Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up the minimum supported Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Audit Cloudflare toolchain dependencies
        shell: /usr/bin/bash -p -e {0}
        run: |
          export PATH="$RUNNER_TOOL_CACHE/node/22.23.2/x64/bin:/usr/bin:/bin"
          test "$(node --version)" = v22.23.2
          npm --prefix infra/cloudflare audit --audit-level=moderate
        id: gate_3
      - name: Set up Go for the repository cross-validator
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: tools/tuf-release/go.sum
      - name: Install the audited Cloudflare toolchain from the lockfile
        run: npm --prefix infra/cloudflare ci
        id: gate_1
      - name: Install the release admission dependency used by preview tests
        run: npm --prefix release ci --ignore-scripts
        id: gate_2
      - name: Cross-check Go materialization with the Cloudflare validator
        working-directory: tools/tuf-release
        env:
          GOTOOLCHAIN: local
          HID_REQUIRE_CLOUDFLARE_VALIDATOR: "1"
        run: go test -count=1 -run TestMaterializedGenerationPassesCloudflareValidator ./internal/repository
        id: gate_4
      - name: Test TUF layout, Worker policy, and deployment boundaries
        run: npm --prefix infra/cloudflare test
        id: gate_5
      - name: Prepare disposable assets for credential-free bundle checks
        run: |
          node --input-type=module <<'EOF'
          import { mkdir, readFile, writeFile } from 'node:fs/promises'
          import { resolve } from 'node:path'

          const cloudflareRoot = resolve('infra/cloudflare')
          for (const deployment of ['staging', 'production']) {
            const workerRoot = resolve(cloudflareRoot, 'workers', `hid-tuf-${deployment}`)
            const config = JSON.parse(await readFile(resolve(workerRoot, 'wrangler.json'), 'utf8'))
            const repository = resolve(process.env.RUNNER_TEMP, `hid-tuf-${deployment}-dry-run-assets`)
            await mkdir(repository, { recursive: true })
            await writeFile(resolve(repository, 'ci-placeholder.txt'), 'credential-free Wrangler dry run\n')
            config.$schema = resolve(cloudflareRoot, 'node_modules/wrangler/config-schema.json')
            config.main = resolve(workerRoot, config.main)
            config.assets.directory = repository
            await writeFile(
              resolve(process.env.RUNNER_TEMP, `hid-tuf-${deployment}-wrangler.json`),
              `${JSON.stringify(config, null, 2)}\n`,
            )
          }
          EOF
        id: gate_6
      - name: Compile the staging TUF Worker without deployment
        run: infra/cloudflare/node_modules/.bin/wrangler deploy --dry-run --config "${RUNNER_TEMP}/hid-tuf-staging-wrangler.json"
        id: gate_7
      - name: Compile the production TUF Worker without deployment
        run: infra/cloudflare/node_modules/.bin/wrangler deploy --dry-run --config "${RUNNER_TEMP}/hid-tuf-production-wrangler.json"
        id: gate_8
      - name: Record credential-free job evidence
        env:
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node release/scripts/collect-local-gate-evidence.mjs
      - name: Retain independent job evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-local-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-gate-evidence.json
          if-no-files-found: error
          retention-days: 90
  ehr-release-cache:
    name: EHR release-bound offline cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up the minimum supported Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Audit EHR and shared source dependencies
        shell: /usr/bin/bash -p -e {0}
        run: |
          export PATH="$RUNNER_TOOL_CACHE/node/22.23.2/x64/bin:/usr/bin:/bin"
          test "$(node --version)" = v22.23.2
          for package in packages/offline packages/telemetry packages/ui; do
            npm --prefix "${package}" audit --audit-level=moderate
          done
          node release/scripts/npm-audit-with-exceptions.mjs apps/ehr
        id: gate_2
      - name: Install EHR and shared source dependencies from their lockfiles
        run: |
          for package in packages/offline packages/telemetry packages/ui apps/ehr; do
            npm --prefix "${package}" ci
          done
        id: gate_1
      - name: Test release-bound cache generation and failure behavior
        run: npm --prefix apps/ehr test
        id: gate_3
      - name: Build the root-hosted release artifact
        env:
          HID_PUBLIC_BASE: /
        run: npm --prefix apps/ehr run build
        id: gate_4
      - name: Verify the built worker is bound to the checked-out release
        run: |
          HID_CI_RELEASE_SHA="$(git rev-parse --verify HEAD)" node --input-type=module <<'EOF'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'

          const serviceWorker = await readFile('apps/ehr/dist/service-worker.js', 'utf8')
          const html = await readFile('apps/ehr/dist/index.html', 'utf8')
          assert.match(process.env.HID_CI_RELEASE_SHA, /^[a-f0-9]{40}$/)
          assert.ok(serviceWorker.includes(process.env.HID_CI_RELEASE_SHA))
          assert.ok(!serviceWorker.includes('__HID_EHR_RELEASE_SHA__'))
          assert.ok(!serviceWorker.includes('__HID_EHR_SHELL_ASSETS__'))
          assert.match(serviceWorker, /assets\/canonical-platform-runtime\.js/)
          assert.match(html, /(?:src|href)="\/assets\//)
          EOF
        id: gate_5
      - name: Record credential-free job evidence
        env:
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node release/scripts/collect-local-gate-evidence.mjs
      - name: Retain independent job evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-local-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-gate-evidence.json
          if-no-files-found: error
          retention-days: 90
  # The former single workspace job, split into three jobs that run side by
  # side. Each job's gate list is fixed in run-workspace-gates.mjs; a pull
  # request run may narrow it to another fixed list chosen by the changes job,
  # and any other value runs the job's full list. Every push, manual and
  # scheduled run runs all three jobs with every gate. No other job uses their
  # artifacts, and a job skipped by its condition concludes as skipped, which
  # leaves the run green.
  workspace:
    name: Workspace build and verification
    needs: changes
    # Always runs; on a pull request that changes no code it runs only the
    # secret scan and the whitespace check, without installing dependencies.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workspace_install != 'none' }}
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
      - name: Install all tracked lockfiles without cloud authority
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workspace_install != 'none' }}
        run: |-
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {dirname} from 'node:path';
          const paths=execFileSync('git',['ls-files','-z','**/package-lock.json'],{encoding:'utf8'}).split('\0').filter(Boolean);
          for(const path of paths) execFileSync('npm',['--prefix',dirname(path),'ci'],{stdio:'inherit'});
          NODE
      - name: Run and record workspace build and verification gates
        env:
          HID_WORKSPACE_GATES: ${{ github.event_name == 'pull_request' && needs.changes.outputs.workspace_gates || '' }}
          HID_WORKSPACE_SKIP_REASON: ${{ needs.changes.outputs.reason }}
        run: node release/scripts/run-workspace-gates.mjs build-verify
      - name: Retain workspace evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-workspace-build-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workspace-gates
          if-no-files-found: warn
          retention-days: 90
  workspace-test:
    name: Workspace tests
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.skip_workspace_test != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
      - name: Install the lockfiles the selected tests need, without cloud authority
        env:
          HID_TEST_INSTALL: ${{ github.event_name == 'pull_request' && needs.changes.outputs.test_install || 'all' }}
        run: |-
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {dirname} from 'node:path';
          const all=execFileSync('git',['ls-files','-z','**/package-lock.json'],{encoding:'utf8'}).split('\0').filter(Boolean);
          // The staging preparation tests load only release and ehr-api dependencies.
          const light=['release/package-lock.json','services/ehr-api/package-lock.json'];
          const paths=process.env.HID_TEST_INSTALL==='staging-preparation'?light:all;
          for(const path of paths) execFileSync('npm',['--prefix',dirname(path),'ci'],{stdio:'inherit'});
          NODE
      - name: Run and record workspace test gates
        env:
          HID_WORKSPACE_GATES: ${{ github.event_name == 'pull_request' && needs.changes.outputs.test_gates || '' }}
          HID_WORKSPACE_SKIP_REASON: ${{ needs.changes.outputs.reason }}
        run: node release/scripts/run-workspace-gates.mjs test
      - name: Retain workspace evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-workspace-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workspace-gates
          if-no-files-found: warn
          retention-days: 90
  migration-rehearsal:
    name: Synthetic migration rehearsal
    needs: changes
    # Runs on every push, manual and scheduled run, and on every pull request
    # that changes database, migration, grant or runtime-verifier code or the
    # services and packages those verifiers boot (see select-local-gates.mjs).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.skip_migration_rehearsal != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install the lockfiles the rehearsal loads, without cloud authority
        run: |
          for package in release packages/api-client packages/server-telemetry services/identity-api services/ehr-api services/lab-api services/pharmacy-api services/ocr-api services/notification-api; do
            npm --prefix "${package}" ci
          done
      - name: Prepare PostgreSQL 16 and pgvector for the disposable rehearsal
        run: |
          # The runner image already ships postgresql-16 from PGDG, and its
          # dependency postgresql-client-16 ships /usr/lib/postgresql/16/bin/pg_config.
          # Install only pgvector, as one pinned PGDG package checked against its
          # SHA-256, with no apt-get update and no Ubuntu mirror.
          deb=postgresql-16-pgvector_0.8.7-1.pgdg24.04+1_amd64.deb
          pool=pub/repos/apt/pool/main/p/pgvector
          dpkg-query --show --showformat='${Status}\n' postgresql-16 | grep -qx 'install ok installed'
          for host in apt.postgresql.org apt-archive.postgresql.org; do
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 --retry 4 --retry-all-errors \
              --connect-timeout 15 --max-time 120 --output "$RUNNER_TEMP/$deb" "https://$host/$pool/$deb" && break
          done
          echo "da584c72f1d84203734a59a773eeb64e0b2b4245393c3fe8eb3013b96ac29daa  $RUNNER_TEMP/$deb" | sha256sum --check --strict
          sudo dpkg --install "$RUNNER_TEMP/$deb"
          test -x /usr/lib/postgresql/16/bin/pg_config
          test -f "$(/usr/lib/postgresql/16/bin/pg_config --sharedir)/extension/vector.control"
      - name: Run and record the synthetic migration rehearsal
        env:
          PG_CONFIG: /usr/lib/postgresql/16/bin/pg_config
        run: node release/scripts/run-workspace-gates.mjs migration-rehearsal
      - name: Retain workspace evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-workspace-migration-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workspace-gates
          if-no-files-found: warn
          retention-days: 90
  # Branch protection on main and tuf-production-release requires a check
  # named "Complete workspace verification", the name of the former single
  # workspace job. This job keeps that check and its meaning: it always runs
  # (it has no condition that can skip it) and passes only when the build and
  # verification job succeeded and the test and rehearsal jobs each succeeded,
  # or were skipped on a pull request because the changes job chose to skip
  # them. Any other event needs all three to succeed.
  workspace-complete:
    name: Complete workspace verification
    needs:
      - changes
      - workspace
      - workspace-test
      - migration-rehearsal
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every workspace job to pass or to be skipped by the pull request selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          WORKSPACE_TEST_RESULT: ${{ needs.workspace-test.result }}
          MIGRATION_REHEARSAL_RESULT: ${{ needs.migration-rehearsal.result }}
          SKIP_WORKSPACE_TEST: ${{ needs.changes.outputs.skip_workspace_test }}
          SKIP_MIGRATION_REHEARSAL: ${{ needs.changes.outputs.skip_migration_rehearsal }}
        run: |
          set -euo pipefail
          status=0
          check() {
            if [ "$2" = success ]; then
              echo "$1: success"
            elif [ "$EVENT_NAME" = pull_request ] && [ "$3" = true ] && [ "$2" = skipped ]; then
              echo "$1: skipped by the pull request gate selection"
            else
              echo "::error::$1 concluded '$2'; it must succeed"
              status=1
            fi
          }
          check 'Workspace build and verification' "$WORKSPACE_RESULT" never
          check 'Workspace tests' "$WORKSPACE_TEST_RESULT" "$SKIP_WORKSPACE_TEST"
          check 'Synthetic migration rehearsal' "$MIGRATION_REHEARSAL_RESULT" "$SKIP_MIGRATION_REHEARSAL"
          exit "$status"
  upstream-reference:
    name: Historical upstream reference oracle
    needs: changes
    # Runs on every push, manual and scheduled run; a pull request skips it only
    # when the changes job says no changed path reaches the TUF tooling. A
    # failed changes job leaves the output empty, so the job runs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.skip_go_jobs != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.25.0
          check-latest: false
          cache: false
      - name: Verify the pinned module graph and upstream identity
        run: node tools/tuf-release/scripts/verify-toolchain.mjs
        id: gate_1
      - name: Reproduce and verify the pinned upstream reference client
        run: |
          build_root="${RUNNER_TEMP}/upstream-tuf-client-reproducibility"
          tuf_source="$(go env GOMODCACHE)/github.com/theupdateframework/go-tuf/v2@v2.4.2"
          test -d "${tuf_source}"
          GOTOOLCHAIN=local go -C "${tuf_source}" mod download
          mkdir -p "${build_root}"
          for build_label in a b; do
            env \
              GOENV=off \
              GOTOOLCHAIN=local \
              GOOS=linux \
              GOARCH=amd64 \
              GOAMD64=v1 \
              CGO_ENABLED=0 \
              GOPROXY=off \
              SOURCE_DATE_EPOCH=0 \
              TZ=UTC \
              LC_ALL=C \
              LANG=C \
              go -C "${tuf_source}" build \
                -mod=readonly \
                -trimpath \
                -buildvcs=false \
                -ldflags=-buildid= \
                -o "${build_root}/tuf-client-${build_label}" \
                ./examples/cli/tuf-client
          done
          cmp "${build_root}/tuf-client-a" "${build_root}/tuf-client-b"
          node tools/tuf-release/scripts/verify-toolchain.mjs \
            --build-a "${build_root}/tuf-client-a" \
            --build-b "${build_root}/tuf-client-b"
        id: gate_2
      - name: Record credential-free job evidence
        env:
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node release/scripts/collect-local-gate-evidence.mjs
      - name: Retain historical oracle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuf-local-upstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-gate-evidence.json
          if-no-files-found: error
          retention-days: 90
